# ---------------------------------------------------------------------------
# Fivetran service -> target. `fivetran_aliases` catches the RDS/Aurora/Azure
# variants Fivetran ships as separate service identifiers.
# ---------------------------------------------------------------------------
mappings:
  # --- Databases ---
  sql_server:
    target: sqlserver
    fivetran_aliases:
      - sql_server_rds
      - sql_server_hva
      - sql_server_rds_hva
      - azure_sql_db
      - azure_sql_managed_db
      - azure_sql_db_hva
      - azure_sql_managed_db_hva
    notes:
      - Fivetran's HVA/Teleport variants all map to the same Lakeflow Connect
        SQL Server connector. Check the Fivetran `update_method` in the
        connection config to understand which change mechanism was in use.

  postgres:
    target: postgresql
    fivetran_aliases:
      - postgres_rds
      - postgres_warehouse
      - aurora_postgres
      - azure_postgres
      - heroku_postgres
      - postgres_hva
      - postgres_rds_hva
      - aurora_postgres_hva

  mysql:
    target: mysql
    fivetran_aliases:
      - mysql_rds
      - mysql_azure
      - aurora
      - maria
      - maria_rds
      - maria_azure
      - mysql_hva
      - mysql_rds_hva
      - aurora_hva

  oracle:
    target: oracle
    fivetran_aliases:
      - oracle_rds
      - oracle_hva
      - oracle_rds_hva
      - oracle_ebs
      - oracle_sap_hva

  teradata:
    target: teradata

  big_query:
    target: bigquery
    fivetran_aliases: [bigquery, bigquery_db]

  snowflake_db:
    target: null
    verdict: unsupported
    fivetran_aliases: [snowflake]
    notes:
      - Snowflake is not a Lakeflow Connect managed ingestion source.
    alternatives:
      - Use Unity Catalog query federation or catalog federation to read
        Snowflake in place, then materialise with a Lakeflow Declarative
        Pipeline if a copy is genuinely needed.

  # --- SaaS ---
  salesforce:
    target: salesforce
    fivetran_aliases: [salesforce_sandbox]
    notes:
      - Fivetran writes Salesforce objects into a schema named after the
        connector; Lakeflow Connect reads them from the fixed source schema
        `objects`. The generated bundle rewrites this for you.

  salesforce_marketing_cloud:
    target: salesforce_marketing_cloud

  hubspot:
    target: hubspot

  jira:
    target: jira
    fivetran_aliases: [jira_cloud, jira_align]

  confluence:
    target: confluence
    fivetran_aliases: [confluence_cloud]

  zendesk:
    target: zendesk
    fivetran_aliases: [zendesk_chat, zendesk_sunshine]
    notes:
      - Only Zendesk Support is covered. Chat and Sunshine objects are not part
        of the managed connector.

  netsuite_suiteanalytics:
    target: netsuite
    fivetran_aliases: [netsuite, netsuite_soap]

  workday:
    target: workday_reports
    fivetran_aliases: [workday_hcm, workday_financial_management]
    verdict: supported_with_changes
    notes:
      - Fivetran's Workday connector syncs objects directly. Lakeflow Connect's
        Workday Reports connector ingests one custom report per destination
        table, so each Fivetran table needs a corresponding Workday RaaS report.
        Budget real Workday-admin time for this.

  service_now:
    target: servicenow
    fivetran_aliases: [servicenow, servicenow_v2]

  google_analytics_4:
    target: google_analytics
    fivetran_aliases: [google_analytics, google_analytics_360]
    verdict: supported_with_changes
    notes:
      - Fivetran GA4 delivers pre-aggregated report tables. Lakeflow Connect
        ingests raw event-level GA4 data, so downstream models built on
        Fivetran's aggregates need rewriting.

  microsoft_dynamics_365:
    target: dynamics365
    fivetran_aliases: [dynamics_365, dynamics_365_fo, dynamics_365_fno]

  sharepoint:
    target: sharepoint
    fivetran_aliases: [microsoft_sharepoint]

  facebook_ads:
    target: meta_ads
    fivetran_aliases: [facebook, instagram_business, facebook_pages]

  google_ads:
    target: google_ads
    fivetran_aliases: [adwords]

  google_drive:
    target: google_drive

  google_search_console:
    target: google_search_console

  gmail:
    target: gmail

  outlook:
    target: outlook
    fivetran_aliases: [microsoft_outlook]

  github:
    target: github

  smartsheet:
    target: smartsheet

  marketo:
    target: marketo

  linkedin_ads:
    target: linkedin_ads
    fivetran_aliases: [linkedin_ad_analytics, linkedin_company_pages]

  tiktok_ads:
    target: tiktok_ads

  reddit_ads:
    target: reddit_ads

  amplitude:
    target: amplitude

  pendo:
    target: pendo

  notion:
    target: notion

  monday:
    target: monday

  pagerduty:
    target: pagerduty

  square:
    target: square

  sendgrid:
    target: sendgrid

  zoho_books:
    target: zoho_books

  aha:
    target: aha

  workiva:
    target: workiva

  # --- Files, streams, and events: no managed connector, but good alternatives
  s3:
    target: null
    verdict: unsupported
    fivetran_aliases: [gcs, azure_blob_storage, s3_data_lake, google_cloud_storage]
    notes:
      - Object storage is not a Lakeflow Connect managed connector.
    alternatives:
      - Use Auto Loader, which is the standard connector for cloud object
        storage and is generally cheaper than Fivetran for file ingestion.

  sftp:
    target: null
    verdict: unsupported
    fivetran_aliases: [ftp, email]
    alternatives:
      - Use the standard SFTP file ingestion connector, or land files in object
        storage and use Auto Loader.

  kafka:
    target: null
    verdict: unsupported
    fivetran_aliases: [confluent_cloud, aws_msk, azure_service_bus, apache_kafka]
    alternatives:
      - Use the Kafka source in a Lakeflow Declarative Pipeline or Structured
        Streaming. This is a standard connector rather than a managed one.

  kinesis:
    target: null
    verdict: unsupported
    fivetran_aliases: [aws_kinesis_firehose, google_pub_sub, azure_event_hub]
    alternatives:
      - Use the matching Structured Streaming source (Kinesis, Pub/Sub, Event
        Hubs) in a Lakeflow Declarative Pipeline.

  webhooks:
    target: null
    verdict: unsupported
    fivetran_aliases: [segment, snowplow, mixpanel_export]
    alternatives:
      - Use Zerobus Ingest for direct event ingestion, or land events in object
        storage and use Auto Loader.
