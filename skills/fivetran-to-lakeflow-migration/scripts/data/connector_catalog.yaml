# Fivetran service -> Lakeflow Connect connector catalog.
#
# `targets` describes Lakeflow Connect managed connectors. `mappings` maps
# Fivetran `service` identifiers onto them.
#
# Connector availability changes on Databricks' release cadence. Treat `status`
# as a hint, not a fact: always confirm in the customer's workspace under
# Settings > Previews before telling them a connector is available.
#
# status values:
#   ga        - generally available (confirmed in docs or release notes)
#   beta      - Beta / Public Preview, gated by the workspace Previews page
#   available - listed as a managed connector, maturity not confirmed
#   none      - no managed connector; see `alternatives`
#
# connection_creation values, from the Unity Catalog connections docs:
#   sql - creatable with CREATE CONNECTION
#   api - creatable with POST /api/2.1/unity-catalog/connections
#   ui  - requires the Catalog Explorer / ingestion wizard (interactive OAuth)
version: 1
last_reviewed: '2026-08-24'
sources:
  - https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/saas-overview
  - https://docs.databricks.com/aws/en/connect/uc-connections
  - https://docs.databricks.com/api/pipelines/v2/pipeline
  - https://docs.databricks.com/api/uc-connections/v1/connection
  - https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/sql-server-overview
  - https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/scd

targets:
  # --- Databases -------------------------------------------------------------
  sqlserver:
    display_name: Microsoft SQL Server
    status: ga
    source_type: SQLSERVER
    connection_type: SQLSERVER
    connection_creation: [sql, api, ui]
    requires_gateway: true
    supports_integrated_cdc: true
    object_spec: table
    needs_source_catalog: true
    source_prerequisites:
      - Enable CDC (`sys.sp_cdc_enable_db` / `sys.sp_cdc_enable_table`) or change
        tracking on the source database. Change tracking alone does not support
        SCD type 2.
      - Grant the ingestion user db_owner or the CDC-specific role, plus
        VIEW DATABASE STATE and VIEW SERVER STATE.
      - Confirm the CDC retention window is long enough that the gateway can keep
        up. Fivetran's HVR/log reader settings do not carry over.
    notes:
      - Two architectures exist. Standard CDC uses a continuously running gateway
        pipeline plus a triggered ingestion pipeline. Integrated CDC (Beta) uses a
        single pipeline with `connector_type: CDC` and no separate gateway.
      - Row filtering is not supported by the API for this connector.

  postgresql:
    display_name: PostgreSQL
    status: available
    source_type: POSTGRESQL
    connection_type: POSTGRESQL
    connection_creation: [sql, api, ui]
    requires_gateway: true
    object_spec: table
    needs_source_catalog: true
    source_prerequisites:
      - Set `wal_level = logical` and restart the instance. On RDS/Aurora set
        `rds.logical_replication = 1` in the parameter group.
      - Create a replication slot and publication for the tables being ingested.
      - Grant the ingestion user REPLICATION plus SELECT on the source tables.

  mysql:
    display_name: MySQL
    status: available
    source_type: MYSQL
    connection_type: MYSQL
    connection_creation: [sql, api, ui]
    requires_gateway: true
    object_spec: table
    needs_source_catalog: true
    source_prerequisites:
      - Enable binary logging with `binlog_format = ROW` and a retention window
        long enough for the gateway to keep up.
      - Grant REPLICATION SLAVE, REPLICATION CLIENT, and SELECT to the
        ingestion user.

  oracle:
    display_name: Oracle
    status: available
    source_type: ORACLE
    connection_type: ORACLE
    connection_creation: [api, ui]
    requires_gateway: true
    object_spec: table
    needs_source_catalog: true
    source_prerequisites:
      - Enable ARCHIVELOG mode and supplemental logging for the ingested tables.
      - Grant the LogMiner privileges required for change capture.
    notes:
      - Defaults to `connector_type: QUERY_BASED` when a connection name is
        supplied without an explicit connector type. Pass `CDC` for log-based
        capture.

  teradata:
    display_name: Teradata
    status: available
    source_type: TERADATA
    connection_type: TERADATA
    connection_creation: [api, ui]
    requires_gateway: true
    object_spec: table
    needs_source_catalog: true

  bigquery:
    display_name: BigQuery
    status: available
    source_type: BIGQUERY
    connection_type: BIGQUERY
    connection_creation: [api, ui]
    requires_gateway: false
    object_spec: table
    needs_source_catalog: true

  # --- SaaS / application connectors ----------------------------------------
  salesforce:
    display_name: Salesforce
    status: ga
    source_type: SALESFORCE
    connection_type: SALESFORCE
    connection_creation: [api, ui]
    requires_gateway: false
    object_spec: table
    # Salesforce objects live under a fixed source schema named "objects";
    # source_table is the SObject API name, for example "Account".
    source_schema_convention: objects
    source_prerequisites:
      - Create a Salesforce user for Databricks with API access and read access to
        every object being ingested.
      - First-time auth needs `Approve Uninstalled Connected Apps`, or
        `Customize Application` plus `Modify All Data`/`Manage Connected Apps`
        when API Access Control is enabled.
    notes:
      - Formula fields are snapshotted on each run by default. Set
        `pipelines.enableSalesforceFormulaFieldsMVComputation: 'true'` in the
        pipeline `configuration` block for incremental formula fields (Beta).
      - Row filtering during ingestion is supported.

  salesforce_marketing_cloud:
    display_name: Salesforce Marketing Cloud
    status: available
    source_type: SALESFORCE
    connection_type: SALESFORCE
    connection_creation: [api, ui]
    requires_gateway: false
    object_spec: table

  workday_reports:
    display_name: Workday Reports
    status: ga
    source_type: WORKDAY_RAAS
    connection_type: WORKDAY_RAAS
    connection_creation: [api, ui]
    requires_gateway: false
    # Workday RaaS objects are addressed by report URL, not schema and table.
    object_spec: report
    source_prerequisites:
      - Build or identify a Workday custom report and enable it as a web service
        (Report as a Service).
      - Create an integration system user with access to the report and record
        the report URL.
    notes:
      - Each report becomes one destination table. A Fivetran Workday connector
        that syncs many objects maps to many report definitions, which is
        usually the largest manual step in a Workday migration.

  workday_hcm:
    display_name: Workday HCM
    status: available
    source_type: WORKDAY_RAAS
    connection_type: WORKDAY_RAAS
    connection_creation: [api, ui]
    requires_gateway: false
    object_spec: table

  servicenow:
    display_name: ServiceNow
    status: ga
    source_type: SERVICENOW
    connection_type: SERVICENOW
    connection_creation: [api, ui]
    requires_gateway: false
    object_spec: table
    source_prerequisites:
      - Create a ServiceNow user with read access to the ingested tables and the
        `sys_db_object` / `sys_dictionary` metadata tables.

  google_analytics:
    display_name: Google Analytics 4
    status: ga
    source_type: GA4_RAW_DATA
    connection_type: GA4_RAW_DATA
    connection_creation: [api, ui]
    requires_gateway: false
    object_spec: table
    notes:
      - Addressed by `source_url` (GCP project id) plus `source_schema`
        (GA4 property name).
      - SCD type 2 is supported only for the `users` and `pseudonymous_users`
        tables. Event-level tables are append-only.

  netsuite:
    display_name: Oracle NetSuite
    status: ga
    source_type: NETSUITE
    connection_type: NETSUITE
    connection_creation: [api, ui]
    requires_gateway: false
    object_spec: table
    source_prerequisites:
      - Enable SuiteAnalytics Connect and create a role with token-based
        authentication for the ingestion user.

  sharepoint:
    display_name: Microsoft SharePoint
    status: ga
    source_type: SHAREPOINT
    connection_type: SHAREPOINT
    connection_creation: [api, ui]
    requires_gateway: false
    object_spec: table

  dynamics365:
    display_name: Microsoft Dynamics 365
    status: ga
    source_type: DYNAMICS365
    connection_type: DYNAMICS365
    connection_creation: [api, ui]
    requires_gateway: false
    object_spec: table
    source_prerequisites:
      - Configure Azure Synapse Link for Dataverse; the connector reads the
        Synapse Link output rather than the Dataverse API directly.

  confluence:
    display_name: Atlassian Confluence
    status: ga
    source_type: CONFLUENCE
    connection_type: CONFLUENCE
    connection_creation: [api, ui]
    requires_gateway: false
    object_spec: table

  jira:
